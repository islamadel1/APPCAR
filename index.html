        :root {

        .field-group label { font-size: 0.88rem; font-weight: 700; color: var(--dark-navy); }
        .field-group input, .field-group select { padding: 11px; border: 1px solid #94a3b8; border-radius: 8px; font-size: 0.92rem; color: var(--text-main); background: var(--white); }

        .bottom-action-bar a { flex: 1; padding: 11px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .act-call-btn { background: var(--accent-orange); color: var(--white); }
        .act-wa-btn { background: var(--whatsapp-green); color: var(--white); }

        footer { background: var(--dark-navy); color: var(--white); text-align: center; padding: 25px 15px; margin-top: 50px; font-size: 0.88rem; border-top: 3px solid var(--primary-blue); }
        footer p { margin-bottom: 6px; font-weight: 600; }
        footer a { color: #ffffff; text-decoration: underline; font-weight: 700; }

        @media (max-width: 768px) {
            .nav-container { justify-content: center; text-align: center; }
            .nav-links { display: none; }
            .header-actions { width: 100%; justify-content: center; margin-top: 5px; }
            .hero-section { min-height: auto; display: block; }
            .hero-container { grid-template-columns: 1fr; }
            .hero-right { min-height: 250px; }
            .hero-main-title { font-size: 1.75rem; }
        }
