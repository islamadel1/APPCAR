    <style>
        :root {
            --dark-navy: #092b3a;
            --primary-blue: #006694;
            --accent-orange: #c2410c;
            --whatsapp-green: #15803d;
            --bg-light: #f4f7f9;
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --radius-lg: 16px;
            --shadow-card: 0 15px 35px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); line-height: 1.6; padding-bottom: 75px; }

        .top-bar { background: var(--accent-orange); color: var(--white); text-align: center; padding: 8px 12px; font-size: 0.85rem; font-weight: 700; }

        header { background: var(--white); box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1250px; margin: 0 auto; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand-logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-text .brand-title { font-size: 1.2rem; font-weight: 900; color: var(--primary-blue); line-height: 1.1; display: block; }
        .brand-text p { font-size: 0.78rem; color: var(--accent-orange); font-weight: 800; }

        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--dark-navy); font-weight: 700; font-size: 0.9rem; }

        .header-actions { display: flex; gap: 8px; }
        .btn-head-call { background: var(--accent-orange); color: var(--white); padding: 8px 15px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .btn-head-wa { background: var(--whatsapp-green); color: var(--white); padding: 8px 15px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }

        /* تثبيت ارتفاع hero-section على الديسك توب لتقليل CLS */
        .hero-section { background: radial-gradient(circle at 70% 30%, #005a82 0%, var(--dark-navy) 100%); color: var(--white); padding: 40px 15px 60px 15px; min-height: 410px; display: flex; align-items: center; }
        .hero-container { width: 100%; max-width: 1250px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 30px; align-items: center; }
        .hero-card { background: var(--white); border-radius: 20px; padding: 24px 20px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); color: var(--text-main); border-top: 5px solid var(--accent-orange); position: relative; }
        .card-header-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--accent-orange); color: var(--white); padding: 3px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; white-space: nowrap; }

        .promo-ribbon { display: inline-flex; align-items: center; gap: 6px; background: #fff7ed; color: var(--accent-orange); border: 1px solid #fdba74; padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; margin: 0 auto 10px auto; }
        .promo-wrap { text-align: center; }

        .service-badge-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
        .special-discount-tag { background: #fff7ed; color: var(--accent-orange); border: 1px solid #fdba74; padding: 2px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 800; white-space: nowrap; }

        .hero-card h2 { text-align: center; color: var(--primary-blue); font-size: 1.35rem; font-weight: 900; }
        .hero-card .sub-title { text-align: center; color: var(--text-muted); font-size: 0.82rem; margin-bottom: 14px; }

        .btn-card-call { background: var(--accent-orange); color: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 1.15rem; margin-bottom: 10px; }
        .btn-card-wa { background: #f0fdf4; border: 1.5px solid var(--whatsapp-green); color: var(--whatsapp-green); display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 0.95rem; margin-bottom: 15px; }
        .btn-card-wa-sub { font-size: 0.75rem; color: #334155; font-weight: 700; }

        .equipment-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; }
        .equipment-title { font-size: 0.84rem; font-weight: 800; color: var(--primary-blue); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .equipment-desc { font-size: 0.8rem; color: #334155; font-weight: 600; }

        .hero-right { min-height: 230px; display: flex; flex-direction: column; justify-content: center; }
        .hero-right-badge { display: inline-block; color: #fed7aa; font-weight: 800; font-size: 0.92rem; margin-bottom: 8px; }
        .hero-main-title { font-size: 2.2rem; font-weight: 900; line-height: 1.3; margin-bottom: 15px; }
        .hero-main-title span { color: #fdba74; }
        .hero-description { font-size: 1rem; color: #f8fafc; margin-bottom: 20px; }

        .hero-pills { display: flex; gap: 10px; flex-wrap: wrap; }
        .pill-item { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); padding: 8px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--white); }
        .pill-item i { color: #fdba74; }

        .main-content { max-width: 1250px; margin: 0 auto; padding: 40px 15px; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h2 { font-size: 1.8rem; color: var(--dark-navy); font-weight: 900; }
